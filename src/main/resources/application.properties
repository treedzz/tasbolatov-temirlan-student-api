spring.application.name=tasbolatov-temirlan-student-api
server.port=8080

# Individual data
app.student-name=Tasbolatov Temirlan
app.version=1.0

# Database settings come from environment variables (docker-compose / .env).
# Defaults are only for running locally without Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:student}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
